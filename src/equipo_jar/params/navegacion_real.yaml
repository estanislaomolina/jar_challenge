# Perfil del robot real (por defecto): aceleración prudente y mayor latencia supuesta
# hasta medir el robot. Ajustar solo con evidencia de ensayos físicos.
nodo_equipo:
  ros__parameters:
    nav_velocidad_max: 0.35
    nav_aceleracion_max: 0.2
    nav_velocidad_cerca_pared: 0.05
    nav_desaceleracion: 0.3
    nav_latencia_s: 0.25

    # Candidato de revisión: no validado en robot.
    nav_velocidad_angular_min: 0.35
    nav_plazo_alineacion_s: 30.0

    # Candidato: observar la respuesta entre correcciones cercanas al rumbo.
    nav_ganancia_yaw: 1.5
    nav_velocidad_angular_max: 0.5
    nav_pulso_giro_s: 0.20
    nav_asentamiento_giro_s: 1.0
    nav_plazo_detenido_s: 20.0
